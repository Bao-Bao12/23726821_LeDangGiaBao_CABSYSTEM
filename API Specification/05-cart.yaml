openapi: 3.0.3
info:
  title: CAB System - Cart API
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
security: [{bearerAuth: []}]
paths:
  /cart:
    get:
      summary: Get current cart
      responses: {'200': {description: Cart information}}
    post:
      summary: Add product to cart
      responses: {'201': {description: Item added}}
  /cart/items/{productId}:
    patch:
      summary: Update cart quantity
      parameters: [{name: productId, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: Cart updated}}
    delete:
      summary: Remove cart item
      parameters: [{name: productId, in: path, required: true, schema: {type: integer}}]
      responses: {'204': {description: Item removed}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
